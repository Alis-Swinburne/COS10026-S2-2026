<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Alisla Foley">
    <meta name="keywords" content="CWA, Help Desk, Appointment, Booking, Form, Swinburne University Students, Hawthorne, ATC620">
    <meta name="description" content="CWA Help Desk Appointment booking form.">
    <title>CWA Help Desk Appointment</title>
</head>

<body>
    <header>
        <a href="http://swin.edu.au">
            <img src ="images/logo.png"
            width="175" 
            alt="Swinburne University of Technology Logo"
            title="Swinburne University of Technology Logo"
            loading="lazy">
        </a>

        <h1>CWA Help Desk Appointment</h1>
    </header>

    <main>
        <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday. <br> </p>
        <p>Check Blackboard for when CWA tutors will be there.</p>

        <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
            <fieldset>
                <legend>Student Details</legend>
                <p><label for="student">Student ID</label>
                    <input type="text" name="student" id="student" required pattern="[0-9]{7,10}"/>
                </p>
            
                <table>
                    <tr>
                        <td>
                            <p><label for="f_name">Given Name</label>
                            <input type="text" name="f_name" id="f_name" required pattern="[A-Za-z]+"/>
                            </p>  
                        </td>
                        <td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
                        <td>
                            <p><label for="l_name">Family Name</label>
                            <input type="text" name="l_name" id="l_name" required pattern="[A-Za-z]+"/>
                            </p>
                        </td>
                    </tr>
                </table>
            </fieldset>  

            <fieldset>
                <legend>Your Unit</legend>
                <p><input type="radio" name="unit" id="COS10011" value="COS10011" required/>
                    <label for="COS10011">COS10011</label>
                    <input type="radio" name="unit" id="COS60004" value="COS60004" required/>
                    <label for="COS60004">COS60004</label>
                    <input type="radio" name="unit" id="COS60007" value="COS60007" required/>
                    <label for="COS60007">COS60007</label>
                
                </p>
            
                <label for="tutor">Your Tutor</label>
                <select name="tutor" id="tutor" required>
                    <option value="">Please Select</option>
                    <option value="mon">Mr. Monday</option>
                    <option value="tue">Ms. Tuesday</option>
                    <option value="wed">Mr. Wednesday</option>
                </select>
            </fieldset>  

            <fieldset>
                <legend>Issue</legend>
                <p>
                    <label><input type="checkbox" name="language" value="html" checked/> HTML</label> &nbsp;&nbsp;&nbsp;
                    <label><input type="checkbox" name="language" value="CSS"/> CSS</label> &nbsp;&nbsp;&nbsp;
                    <label><input type="checkbox" name="language" value="JavaScript"/> JavaScript</label> &nbsp;&nbsp;&nbsp;
                    <label><input type="checkbox" name="language" value="PHP"/> PHP</label> &nbsp;&nbsp;&nbsp;
                    <label><input type="checkbox" name="language" value="MySQL"/> MySQL</label> &nbsp;&nbsp;&nbsp;
                </p>

                <form action="/submit-comment" method="POST">
                    <p>
                        <label for="desc-of-issue">Description of Issue</label><br>
                        <textarea id="desc-of-issue" name="issue" rows="4" cols="40" placeholder="Write description of your problem here..."></textarea>
                    </p>
                </form>
            </fieldset>

            <fieldset>
                <legend>Preferred Date/Time</legend>
                <p><label for="date">Date</label>
                    <input type="date" name="date" id="date" placeholder="dd-mm-yyyy" maxlength="10" size="10">
                </p>

                <p><label for="time">Time</label>
                    <input type="time" name="time" id="time" placeholder="00:00" maxlength="5" size="5">
                </p>

            </fieldset>
        </form>

        <input type="submit" value="Book"/>
        <input type="reset" value="Reset Form"/>
    </main>

</body>
</html>
